# Configuracao EXCLUSIVA para testes Maven/JUnit (profile test).
# Nunca conecta ao PostgreSQL/Neon da producao.
spring.datasource.url=jdbc:h2:mem:ritmo_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# As tabelas sao criadas apenas na memoria e descartadas ao finalizar os testes.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Chave ficticia local, valida apenas para execucao dos testes.
app.jwt.secret=cml0bW8tb25seS10ZXN0LWtleS0zMi1ieXRlLXNlY3JldCEh
app.jwt.expiration-seconds=3600
